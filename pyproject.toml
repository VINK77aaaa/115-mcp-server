[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "115-MCP-Server"
version = "0.1.0"
description = "FastMCP server for 115 cloud storage powered by p115client"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "flami" }
]
dependencies = [
  "fastmcp>=3.1.1,<4",
  "p115client>=0.0.8.4.6,<0.1",
  "pydantic-settings>=2.0,<3",
  "yarl>=1.23,<2",
]

[project.optional-dependencies]
# 批量上传的看门狗用 psutil 读本机网卡上行速率（双指标判卡死）。
# 缺失时自动退化为单指标，不影响功能。
upload = ["psutil>=5.9"]

[project.scripts]
115-MCP-Server = "mcp_115_server.server:main"
115-batch-upload = "mcp_115_server.batch_upload:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
